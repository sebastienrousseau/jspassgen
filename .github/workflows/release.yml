name: Release

# `published`, not `created`: gh release create with assets makes a draft,
# uploads, then publishes, and a draft's `created` event starts no workflow.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testing & Coverage
        run: npm run test

  publish-npmjs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Releases use npm trusted publishing (OIDC): npmjs.com trusts this
      # repository's release.yml for @sebastienrousseau/jspassgen, so no
      # NPM_TOKEN is stored. The trusted publisher may only *stage* a
      # release: a maintainer makes it public with `npm stage approve <id>`,
      # which asks for their second factor.
      # package-manager-cache is off so a cached npm cannot shadow the npm
      # bundled with Node 24.
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # `npm stage` arrived after OIDC support (npm 11.5.1), so an npm that
      # has it can do both.
      - name: Require an npm that can stage with OIDC
        run: |
          npm --version
          if ! npm stage --help >/dev/null 2>&1; then
            echo "::error::npm $(npm --version) has no 'npm stage'; staged publishing needs a newer npm"
            exit 1
          fi

      # A trusted publisher can only be attached to a package that already
      # exists, so a new package's first version is published by hand. The
      # job then has nothing to stage for that version.
      - name: Skip versions already on npmjs
        id: registry
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already on npmjs; nothing to stage"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: npm ci

      - name: Build distribution
        if: steps.registry.outputs.published == 'false'
        run: npm run build

      - name: Stage for npmjs with SLSA provenance
        if: steps.registry.outputs.published == 'false'
        run: |
          cd dist
          npm stage publish --access public --tag latest --provenance --registry=https://registry.npmjs.org

  publish-github-packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@sebastienrousseau"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build

      # The package is already scoped to @sebastienrousseau, so only the
      # registry in publishConfig changes for GitHub Packages.
      - name: Point publishConfig at GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('dist/package.json', 'utf8'));
            pkg.publishConfig = { access: 'public', registry: 'https://npm.pkg.github.com/' };
            fs.writeFileSync('dist/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to GitHub Packages
        run: |
          cd dist
          npm publish --access public --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
