name: Release

# `published`, not `created`: gh release create with assets makes a draft,
# uploads, then publishes, and a draft's `created` event starts no workflow.
#
# workflow_dispatch publishes an existing release tag to npmjs only, for a
# release whose npm job failed: the maintainer runs it from main with the
# tag, approves the npm environment, and the tag's code is built, tested
# and published with provenance. GitHub Packages is left alone.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npmjs (e.g. v0.0.21)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testing & Coverage
        run: npm run test

  # Publishes to npmjs only after a maintainer approves the `npm`
  # environment (required reviewer). The package's npm trusted publisher
  # accepts this repository's release.yml in that environment, so no
  # NPM_TOKEN is stored and nothing reaches npm without the approval.
  # npm attaches provenance. This replaces `npm stage publish`, which
  # failed with E401 for 0.0.21 even with a stage-only trusted publisher;
  # it is the setup crypto-service releases with.
  publish-npmjs:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # package-manager-cache is off so a cached npm cannot shadow the npm
      # bundled with Node 24 (>= 11.5.1, needed for trusted publishing).
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Skip versions already on npmjs
        id: registry
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "spec=${name}@${version}" >> "$GITHUB_OUTPUT"
          if npm view "${name}@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already on npmjs; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: npm ci

      - name: Build distribution
        if: steps.registry.outputs.published == 'false'
        run: npm run build

      - name: Publish to npmjs with provenance
        if: steps.registry.outputs.published == 'false'
        run: |
          cd dist
          npm publish --access public --tag latest --provenance --registry=https://registry.npmjs.org

      - name: Verify the version is public on npmjs
        if: steps.registry.outputs.published == 'false'
        env:
          SPEC: ${{ steps.registry.outputs.spec }}
        run: npm view "$SPEC" version dist.integrity --registry=https://registry.npmjs.org

  publish-github-packages:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@sebastienrousseau"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build

      # The package is already scoped to @sebastienrousseau, so only the
      # registry in publishConfig changes for GitHub Packages.
      - name: Point publishConfig at GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('dist/package.json', 'utf8'));
            pkg.publishConfig = { access: 'public', registry: 'https://npm.pkg.github.com/' };
            fs.writeFileSync('dist/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to GitHub Packages
        run: |
          cd dist
          npm publish --access public --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
