# Deploys the web demo to GitHub Pages with GitHub Actions.
#
# The demo is built from the default branch (npm run web:build) and the
# output in dist/web is uploaded, so every change to the web UI or the
# core reaches the site when it lands on main. It used to upload the
# committed gh-pages branch unchanged, which kept serving an old bundle
# after fixes to the web UI. The gh-pages branch is no longer read; it
# can be removed by the maintainer once this deployment is confirmed.
#
# A custom domain, if any, is kept in the repository's Pages settings
# (cname), which a workflow deployment uses, so no CNAME file is needed.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload the demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build the web demo
        run: npm run web:build
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the demo
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
