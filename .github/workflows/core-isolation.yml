name: "Core Isolation Check"

on:
  pull_request:
    branches:
      - "*"
    paths:
      - "packages/core/**"
      - "scripts/verify-core-deps.js"
  push:
    branches:
      - "*"
    paths:
      - "packages/core/**"
      - "scripts/verify-core-deps.js"

# Read-only by default; a job that needs more says so.
permissions:
  contents: read

jobs:
  verify-core-isolation:
    name: Verify Core Package Isolation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify core isolation
        run: node scripts/verify-core-deps.js

      - name: Lint core package
        run: npx eslint packages/core/src --config packages/core/eslint.config.js
